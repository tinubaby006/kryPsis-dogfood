version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfoodpassword
      POSTGRES_DB: dogfood_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: dogfood-app:local
    pull_policy: build
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgres://dogfood:dogfoodpassword@db:5432/dogfood_db?schema=public
      - BETTER_AUTH_SECRET=fallback_secret_for_offline_demo_only_1234567890
      - BETTER_AUTH_URL=http://127.0.0.1:3000
      - ASSESSMENT_MODE=${ASSESSMENT_MODE:-0}
      - DOGFOOD_CONFIG_PATH=/app/assessment/.dogfood.toml
      - PRISMA_SCHEMA_ENGINE_BINARY=/app/node_modules/@prisma/engines/schema-engine-debian-openssl-1.1.x
    volumes:
      - uploads:/app/uploads
      - assessment:/app/assessment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  assessment:
